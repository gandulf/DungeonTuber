name: Lint & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . flake8 pytest httpx

    - name: Lint with flake8
      run: |
        flake8

    - name: Test core and server with pytest
      run: |
        pytest

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Check, test and build the web frontend
      working-directory: web
      run: |
        npm ci
        npm run check
        npm test
        npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v4
    - name: Build server image (no push)
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: dungeontuber:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

  youtube-agent-docker:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v4
    - name: Build YouTube agent image (no push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: agents/youtube/Dockerfile
        push: false
        tags: dungeontuber-youtube-agent:ci
        cache-from: type=gha,scope=youtube-agent
        cache-to: type=gha,mode=max,scope=youtube-agent

  voxalyzer-docker:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v4
    - name: Build Voxalyzer image (no push)
      uses: docker/build-push-action@v7
      with:
        context: agents/voxalyzer
        push: false
        tags: voxalyzer:ci
        cache-from: type=gha,scope=voxalyzer
        cache-to: type=gha,mode=max,scope=voxalyzer
