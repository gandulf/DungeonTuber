name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v0.7.12-beta)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.vars.outputs.app_version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version_tag }}"
          else
            echo "Unsupported trigger" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "app_version=${tag#v}" >> "$GITHUB_OUTPUT"

  # --- Python wheel (server + desktop launcher, web frontend included) -------
  wheel:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set version
        run: sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.app_version }}"/' pyproject.toml
      - name: Test
        run: |
          pip install .[dev]
          flake8
          pytest
      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Build wheel
        run: python -m build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  # --- Docker image (linux/amd64 + linux/arm64, e.g. Raspberry Pi) -----------
  docker:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set version
        run: sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.app_version }}"/' pyproject.toml
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dungeontuber
          tags: |
            type=raw,value=${{ needs.version.outputs.app_version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.app_version, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Windows desktop installer (PyInstaller + Inno Setup, signed) -----------
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.app_version }}"
          (Get-Content version.rc) -replace "'ProductVersion', '(.*?)'", ("'ProductVersion', '" + $version + "'") | Out-File -encoding UTF8noBom version.rc
          (Get-Content pyproject.toml) -replace '^version = "(.*?)"', ('version = "' + $version + '"') | Out-File -encoding UTF8noBom pyproject.toml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[desktop,dev]

      - name: Build executable
        run: pyinstaller DungeonTuber.spec --noconfirm

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: DungeonTuber.iss
          options: /O+

      - name: Prepare Certificate for Signing
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          [System.IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", $certBytes)

      - name: Prepare Signtool
        uses: KamaranL/add-signtool-action@v1
        id: signtool

      - name: Sign Executable
        shell: pwsh
        run: |
          signtool sign /f "$env:TEMP\cert.pfx" /p "${{ secrets.PFX_PASSWORD }}" `
             /fd sha256 /td sha256 `
             /tr http://timestamp.digicert.com `
             "DungeonTuber-${{ needs.version.outputs.app_version }}.exe"

      - name: Cleanup Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\cert.pfx") { Remove-Item "$env:TEMP\cert.pfx" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: DungeonTuber-*.exe

  # --- WiZ light agent (single Windows executable, see agents/wiz) ---------------
  wiz-agent:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: agents/wiz/pyproject.toml
      - name: Build executable
        working-directory: agents/wiz
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .
          python build.py
      - name: Name the executable after the release
        shell: pwsh
        run: Move-Item agents/wiz/dist/DungeonTuberWizAgent.exe "DungeonTuberWizAgent-${{ needs.version.outputs.app_version }}.exe"

      - name: Prepare Certificate for Signing
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          [System.IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", $certBytes)

      - name: Prepare Signtool
        uses: KamaranL/add-signtool-action@v1
        id: signtool

      - name: Sign Executable
        shell: pwsh
        run: |
          signtool sign /f "$env:TEMP\cert.pfx" /p "${{ secrets.PFX_PASSWORD }}" `
             /fd sha256 /td sha256 `
             /tr http://timestamp.digicert.com `
             "DungeonTuberWizAgent-${{ needs.version.outputs.app_version }}.exe"

      - name: Cleanup Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\cert.pfx") { Remove-Item "$env:TEMP\cert.pfx" }

      - uses: actions/upload-artifact@v7
        with:
          name: wiz-agent
          path: DungeonTuberWizAgent-*.exe

  # --- Voxalyzer analyzer (single Windows executable, models are downloaded on first start, see agents/voxalyzer) ---
  voxalyzer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: agents/voxalyzer/pyproject.toml
      - name: Build executable
        working-directory: agents/voxalyzer
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,windows]"
          pyinstaller voxalyzer.spec --noconfirm
      - name: Name the executable after the release
        shell: pwsh
        run: Move-Item agents/voxalyzer/dist/voxalyzer.exe "voxalyzer-${{ needs.version.outputs.app_version }}.exe"

      - name: Prepare Certificate for Signing
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          [System.IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", $certBytes)

      - name: Prepare Signtool
        uses: KamaranL/add-signtool-action@v1
        id: signtool

      - name: Sign Executable
        shell: pwsh
        run: |
          signtool sign /f "$env:TEMP\cert.pfx" /p "${{ secrets.PFX_PASSWORD }}" `
             /fd sha256 /td sha256 `
             /tr http://timestamp.digicert.com `
             "voxalyzer-${{ needs.version.outputs.app_version }}.exe"

      - name: Cleanup Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\cert.pfx") { Remove-Item "$env:TEMP\cert.pfx" }

      - uses: actions/upload-artifact@v7
        with:
          name: voxalyzer
          path: voxalyzer-*.exe

  # --- Voxalyzer Docker image (CUDA, linux/amd64, see agents/voxalyzer/Dockerfile) --------
  voxalyzer-docker:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space (CUDA base image is large)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
          docker-images: true
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dungeontuber-voxalyzer
          tags: |
            type=raw,value=${{ needs.version.outputs.app_version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.app_version, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/voxalyzer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=voxalyzer
          cache-to: type=gha,mode=max,scope=voxalyzer

  # --- GitHub release with installer, wheel and agents ----------------------
  release:
    needs: [version, wheel, windows, docker, wiz-agent, voxalyzer, voxalyzer-docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/DungeonTuber-*.exe
            artifacts/DungeonTuberWizAgent-*.exe
            artifacts/voxalyzer-*.exe
            artifacts/*.whl
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.app_version }}
          draft: true
          prerelease: ${{ contains(needs.version.outputs.app_version, '-') }}
          body: |
            **Windows:** download and run `DungeonTuber-${{ needs.version.outputs.app_version }}.exe`.

            **Server (Docker):** `docker pull ghcr.io/${{ github.repository_owner }}/dungeontuber:${{ needs.version.outputs.app_version }}` – see `deploy/docker-compose.yml`.

            **Server (Python):** `pipx install <wheel-file>` then `dungeontuber-server`.

            **Voxalyzer** (analysis agent, run next to your GPU): `voxalyzer-${{ needs.version.outputs.app_version }}.exe` – see `agents/voxalyzer/README.md`. Docker (NVIDIA GPU): `docker pull ghcr.io/${{ github.repository_owner }}/dungeontuber-voxalyzer:${{ needs.version.outputs.app_version }}`.

            **WiZ light agent** (runs next to the bulbs, for a server outside their network): `DungeonTuberWizAgent-${{ needs.version.outputs.app_version }}.exe --token <token>` (add `--server <url>` for a server other than dungeontuber.duckdns.org) – see `agents/wiz/README.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
