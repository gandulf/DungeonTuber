# DungeonTuber server with automatic HTTPS (Caddy).
#
#   1. Copy this folder, adjust DOMAIN in Caddyfile, the music path and the password below.
#   2. docker compose up -d
#
# LAN only (no domain): remove the caddy service and publish "8765:8765" on dungeontuber instead.
# WiZ lights: bulbs are found via UDP broadcast, which needs `network_mode: host` (Linux hosts only).

services:
  dungeontuber:
    image: ghcr.io/gandulf/dungeontuber:latest
    restart: unless-stopped
    environment:
      DT_PASSWORD: "change-me"          # login password for the web interface
      DT_LIBRARY: /music                # several folders: /music:/effects
      DT_FORWARDED_ALLOW_IPS: "*"       # trust X-Forwarded-* headers from Caddy
      # DT_FAKE_LIGHTS: "1"            # simulated bulbs for testing
      # API keys and endpoints (optional; a value saved in Settings wins, these are never written to settings.json):
      # DT_GEMINI_API_KEY: "AIza..."                  # AI assistant: song suggestions and general chat (aistudio.google.com)
      # DT_GEMINI_MODEL: "gemini-3.8-flash"
      # DT_GROQ_API_KEY: "gsk_..."                    # AI assistant: smart search and composing (console.groq.com)
      # DT_GROQ_MODEL: "openai/gpt-oss-120b"
      # DT_MUSICGEN_URL: "https://...modal.run"       # music generation, see agents/musicgen
      # DT_MUSICGEN_KEY: "wk-..."
      # DT_MUSICGEN_SECRET: "ws-..."
      # DT_SOUNDGEN_URL: "https://...modal.run"       # sound generation, see agents/soundgen
      # DT_SOUNDGEN_KEY: "wk-..."
      # DT_SOUNDGEN_SECRET: "ws-..."
      # DT_VOXALYZER_CLOUD_URL: "https://...modal.run"  # cloud analysis, see agents/voxalyzer
      # DT_VOXALYZER_CLOUD_KEY: "wk-..."
      # DT_VOXALYZER_CLOUD_SECRET: "ws-..."
      # DT_MODAL_KEY: "wk-..."                        # one Modal proxy auth token for both functions instead of the keys above
      # DT_MODAL_SECRET: "ws-..."
      # DT_ACOUSTID_API_KEY: "..."                    # metadata lookup by sound (acoustid.org/new-application)
    volumes:
      - ./data:/data                    # settings.json + library.db
      - /path/to/your/music:/music      # your mp3 library (read/write: tags, playlists, uploads)
    # network_mode: host                # enable for WiZ light discovery (then drop caddy's link or use host networking there too)
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dungeontuber

volumes:
  caddy-data:
  caddy-config:
