[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "server", "server.routes"]
py-modules = ["DungeonTuber"]

[project]
name = "DungeonTuber"
version = "0.2.0.0"
description = "RPG music player with advanced categorization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Gandulf Kohlweiss", email = "gandulf.k@gmail.com"}
]
dependencies = [
    "mutagen>=1.48.1",
    "psutil>=7.2.2",
    "pywizlight>=0.6.6",
    "packaging>=24.0",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "pillow>=12.3",
    "pywebview>=6.2"
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.22.3",
    "flake8>=7.4.1",
    "pytest>=9.0",
    "httpx>=0.28",
    "Nuitka[app]>=4.2.2"
]

[project.scripts]
dungeontuber = "DungeonTuber:main"
dungeontuber-server = "server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
